services:
  db:
    image: mysql:8.0.32
    container_name: database
    command: --default-authentication-plugin=mysql_native_password
    entrypoint: [ "/bin/bash", "/cleanup-entrypoint.sh" ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Rule #4: no host port mappings. DB is reachable only via finance_db_net.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup_config/db_backups:/backups
      - ./backup_config/backup.sh:/backup.sh
      - ./backup_config/cleanup-entrypoint.sh:/cleanup-entrypoint.sh
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - finance_db_net

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    # Rule #4: no host port mapping.
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes", "--save", "60", "1" ]
    networks:
      - finance_db_net

  redis-cli:
    image: redis:latest
    container_name: redis-cli
    restart: unless-stopped
    depends_on:
      - redis
    entrypoint: [ "redis-cli", "-h", "redis" ]
    stdin_open: true
    tty: true
    networks:
      - finance_db_net

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: scheduler
    command: daemon --config=/etc/ofelia/config.ini
    environment:
      # Rule #6: restricted Docker API instead of the raw socket.
      - DOCKER_HOST=tcp://docker_socket_proxy_ofelia:2375
    volumes:
      - ./backup_config/config.ini:/etc/ofelia/config.ini
      - ./backup_config/config.ini:/etc/ofelia.conf
      - ./backup_config/backup.sh:/backup.sh
    restart: unless-stopped
    networks:
      - personal_finance_network
      - ofelia_proxy_net

volumes:
  mysql_data:
    external:
      name: personal_finance_data_volume
  redis_data:
    driver: local

networks:
  personal_finance_network:
    name: personal_finance_network
    driver: bridge
  finance_db_net:
    external: true
  ofelia_proxy_net:
    external: true
